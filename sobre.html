<h1>GRIS</h1>

<p>Gris é um jogo indie de plataforma lançado em 2018 pelo Nomada Studio, conhecido por sua estética artística e 
narrativa emocional sem diálogos. Ele acompanha uma jovem em uma jornada de luto e autodescoberta, explorando temas como tristeza,
 superação e aceitação.</p>
