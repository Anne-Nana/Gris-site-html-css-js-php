<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
	
<script type="text/javascript">
		//função para verificar campo 
	function verifica_login(){
		//campo do usuario
		if(document.form_login.user.value == ""){
			alert("Por favor, informe o usuário!"); 
			document.form_login.user.focus();
			return false; 
		}
		
		//campo da senha
		if(document.form_login.senha.value == ""){
			alert("Digite sua senha!"); 
			document.form_login.senha.focus();
			return false; 
		}
		
		//todos preenchidos
		return true; 
	}
</script>
	
</head>

<div class="container" style="margin-top: 100px;">
        <div class="login-box" style="margin: 0 auto; width: 300px; background: #16213E; padding: 20px; border-radius: 10px;">
            <h2 style="color: #E94560;">Login</h2>
            
			<!-- POST é mais seguro -->
            <form action="login.php" method="POST" onsubmit="verifica_login()" target="_top" >
                <table width="100%">
                    <tr>
                        <td>Usuário:</td>
                        <td><input type="text" name="user" style="width:100%"></td>
                    </tr>
                    <tr>
                        <td>Senha:</td>
                        <td><input type="password" name="senha" style="width:100%"></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <br><input type="submit" value="Entrar">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
