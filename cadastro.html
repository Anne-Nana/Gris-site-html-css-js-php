<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro Jogadore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script type="text/javascript"> //validando dados
    function verifica_Formulario() {
        if (cadastro.nome.value == "") {
            alert("Preencher o nome");
            cadastro.nome.focus();
            return false;
        }
        if (cadastro.email.value == "") {
            alert("Preencher o Email");
            cadastro.email.focus();
            return false;
        }
        if (cadastro.usuario.value == "") {
            alert("Preencher o Usuário");
            cadastro.usuario.focus();
            return false;
        }
        if (cadastro.senha.value == "") {
            alert("Preencher a Senha");
            cadastro.senha.focus();
            return false;
        }
        return true;
    }

</script> 

<div>
 <form action="cadastro.php" name="cadastro" method="GET" onsubmit="return verifica_Formulario()">
        <table class="form-table" align="center">
            <tr>
                <td class="label">Nome:</td>
                <td><input type="text" name="nome"></td>
                <td class="label">Número:</td>
                <td><input type="text" name="numero"></td>
            </tr>
            <tr>
                <td class="label">Endereço:</td>
                <td colspan="3"><input type="text" name="endereco"></td>
            </tr>
            <tr>
                <td class="label">Complemento:</td>
                <td><input type="text" name="complemento"></td>
                <td class="label">Bairro:</td>
                <td><input type="text" name="bairro"></td>
            </tr>
            <tr>
                <td class="label">Cidade:</td>
                <td><input type="text" name="cidade"></td>
                <td class="label">CEP:</td>
                <td><input type="text" name="cep"></td>
            </tr>
            <tr>
                <td class="label">UF:</td>
                <td colspan="3">
                    <select name="uf">
                        <option value="">Selecione...</option>
                        <option value="AC">AC</option><option value="AL">AL</option>
                        <option value="AP">AP</option><option value="AM">AM</option>
                        <option value="BA">BA</option><option value="CE">CE</option>
                        <option value="DF">DF</option><option value="ES">ES</option>
                        <option value="GO">GO</option><option value="MA">MA</option>
                        <option value="MT">MT</option><option value="MS">MS</option>
                        <option value="MG">MG</option><option value="PA">PA</option>
                        <option value="PB">PB</option><option value="PR">PR</option>
                        <option value="PE">PE</option><option value="PI">PI</option>
                        <option value="RJ">RJ</option><option value="RN">RN</option>
                        <option value="RS">RS</option><option value="RO">RO</option>
                        <option value="RR">RR</option><option value="SC">SC</option>
                        <option value="SP">SP</option><option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">Email:</td>
                <td><input type="text" name="email"></td>
                <td class="label">Usuário:</td>
                <td><input type="text" name="usuario"></td>
            </tr>
            <tr>
                <td class="label">Senha:</td>
                <td><input type="password" name="senha"></td>
            </tr>
            <tr>
                <td colspan="4" class="botao">
                    <input type="submit" value="Finalizar Cadastro">
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
